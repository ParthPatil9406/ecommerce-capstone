<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Admin — Aperture Storefront</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="navbar">
  <a class="navbar__brand" href="index.html">Aperture</a>
  <div class="navbar__links">
    <a href="index.html">Catalog</a>
    <a href="cart.html">Cart<span id="cartCount" class="cart-badge" hidden>0</span></a>
    <a id="adminLink" href="admin.html" hidden>Admin</a>
    <div id="authArea"></div>
    <button class="btn-ghost" id="themeToggle" type="button">Dark mode</button>
  </div>
</header>

<main class="container">
  <p id="adminGate" class="catalog-empty" hidden>
    You need to be signed in as <strong>admin</strong> to view this page.
    <a href="login.html">Sign in</a>.
  </p>

  <div id="adminPanel" class="panel" hidden>
    <h1 style="font-family: var(--font-display); font-size: var(--step-2); margin-top:0;">Manage listings</h1>

    <form id="adminForm" class="listings-form">
      <input id="listingTitle" placeholder="Title" required>
      <input id="listingPrice" type="number" step="0.01" min="0" placeholder="Price" required>
      <input id="listingCategory" placeholder="Category">
      <button class="product-card__add" type="submit">Add listing</button>
    </form>

    <ul id="adminList" class="listings-list"></ul>
  </div>
</main>

<script type="module">
  import './js/app.js';
  import { initAdminPage } from './js/admin.js';
  initAdminPage();
</script>
</body>
</html>
