<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cart — Aperture Storefront</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="navbar">
  <a class="navbar__brand" href="index.html">Aperture</a>
  <div class="navbar__links">
    <a href="index.html">Catalog</a>
    <a href="cart.html">Cart<span id="cartCount" class="cart-badge" hidden>0</span></a>
    <a id="adminLink" href="admin.html" hidden>Admin</a>
    <div id="authArea"></div>
    <button class="btn-ghost" id="themeToggle" type="button">Dark mode</button>
  </div>
</header>

<main class="container">
  <div class="panel">
    <h1 style="font-family: var(--font-display); font-size: var(--step-2); margin-top:0;">Your cart</h1>

    <div id="cartError" class="error-banner" hidden style="margin-bottom: var(--space-4);">
      <span class="error-banner__message"></span>
    </div>

    <p id="cartEmpty" class="catalog-empty" hidden>Your cart is empty. <a href="index.html">Browse the catalog</a>.</p>

    <ul id="cartList" class="cart-list"></ul>

    <div class="cart-total-row">
      <span>Total</span>
      <span id="cartTotal">$0.00</span>
    </div>
    <button class="product-card__add" id="checkoutBtn" type="button" style="margin-top: var(--space-4);">Checkout (simulated)</button>
  </div>
</main>

<script type="module">
  import './js/app.js';
  import { initCartPage } from './js/cart.js';
  initCartPage();
</script>
</body>
</html>
